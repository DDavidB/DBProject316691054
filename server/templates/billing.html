<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול תשלומים וחשבוניות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', 'Inter', sans-serif; background-color: #f4f4f4; }
        .small-note { font-size: 0.85rem; color: #64748b; }
        .hidden { display: none; }
    </style>
</head>
<body class="p-6">
    <div class="container mx-auto max-w-5xl bg-white rounded-3xl shadow-lg p-8">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold text-slate-900">ניהול תשלומים וחשבוניות</h1>
                <p class="text-slate-500 mt-2">הוספת תשלום חדש והצגת תשלומים אחרונים מהמסד.</p>
            </div>
            <button onclick="window.location.href='/screen'" class="bg-indigo-600 text-white px-5 py-3 rounded-2xl hover:bg-indigo-700 transition-all">חזרה ללוח בקרה</button>
        </div>
        <form id="billingForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="font-semibold text-slate-700">חיפוש מטופל (שם או טלפון)</label>
                    <input id="patientSearch" type="text" placeholder="הקלד שם מטופל או טלפון..." class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                    <div id="patientSuggestions" class="bg-white border border-slate-200 rounded-2xl mt-2 max-h-60 overflow-auto hidden"></div>
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-slate-700">שם מטופל שנבחר</label>
                    <div id="selectedPatient" class="px-4 py-3 border border-slate-200 rounded-2xl bg-slate-50 text-slate-700">לא נבחר מטופל</div>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="font-semibold text-slate-700">סוג טיפול / שירות</label>
                    <select id="serviceType" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                        <option value="בדיקת רופא שגרתית">בדיקת רופא שגרתית (150 ש"ח)</option>
                        <option value="חיסון">חיסון (50 ש"ח)</option>
                        <option value="ייעוץ מומחה">ייעוץ מומחה (350 ש"ח)</option>
                        <option value="בדיקת דם">בדיקת דם (80 ש"ח)</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-slate-700">סכום לתשלום</label>
                    <input id="amount" type="number" min="1" step="0.01" value="150" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="font-semibold text-slate-700">אמצעי תשלום</label>
                    <select id="paymentMethod" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                        <option value="Credit Card">כרטיס אשראי</option>
                        <option value="Cash">מזומן</option>
                        <option value="Bank Transfer">העברה בנקאית</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-slate-700">תאריך תשלום</label>
                    <input id="paymentDate" type="date" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="font-semibold text-slate-700">4 ספרות אחרונות בכרטיס</label>
                    <input id="cardLast4" type="text" maxlength="4" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="1234">
                </div>
                <div class="space-y-2">
                    <label class="font-semibold text-slate-700">קוד אישור</label>
                    <input id="authCode" type="text" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="Auth code">
                </div>
            </div>
            <div class="space-y-2">
                <label class="font-semibold text-slate-700">הערות</label>
                <textarea id="notes" rows="3" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="הערות נוספות"></textarea>
            </div>
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                <button type="submit" class="w-full md:w-auto bg-emerald-600 text-white px-6 py-3 rounded-2xl hover:bg-emerald-700 transition-all">בצע תשלום והפק חשבונית</button>
                <p id="paymentMessage" class="text-slate-500 small-note"></p>
            </div>
        </form>
        <hr class="my-8 border-slate-200">
        <h2 class="text-2xl font-bold text-slate-900 mb-4">תשלומים אחרונים</h2>
        <div class="overflow-x-auto bg-white border border-slate-200 rounded-3xl shadow-sm">
            <table class="w-full text-right">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200">
                        <th class="px-6 py-4 text-sm font-semibold text-slate-600">מס' חשבונית</th>
                        <th class="px-6 py-4 text-sm font-semibold text-slate-600">תאריך</th>
                        <th class="px-6 py-4 text-sm font-semibold text-slate-600">שם המטופל</th>
                        <th class="px-6 py-4 text-sm font-semibold text-slate-600">שירות</th>
                        <th class="px-6 py-4 text-sm font-semibold text-slate-600">סכום</th>
                        <th class="px-6 py-4 text-sm font-semibold text-slate-600">סטטוס</th>
                    </tr>
                </thead>
                <tbody id="paymentsTableBody" class="divide-y divide-slate-100">
                    <tr><td class="px-6 py-4 text-sm text-slate-500" colspan="6">טוען תשלומים...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        let selectedPatient = null;

        function initBilling() {
            document.getElementById('paymentDate').value = new Date().toISOString().slice(0, 10);
            document.getElementById('billingForm').addEventListener('submit', createPayment);
            document.getElementById('patientSearch').addEventListener('input', debounce(searchPatients, 300));
            loadPayments();
        }

        async function searchPatients(event) {
            const value = event.target.value.trim();
            const suggestions = document.getElementById('patientSuggestions');
            if (!value) {
                suggestions.innerHTML = '';
                suggestions.classList.add('hidden');
                return;
            }
            const response = await fetch(`/api/patients?search=${encodeURIComponent(value)}&limit=10`);
            const data = await response.json();
            const rows = data.data || [];
            suggestions.innerHTML = rows.map(patient => `
                <div onclick="selectPatient(${patient.Patient_ID}, '${patient.First_Name} ${patient.Last_Name}')" class="cursor-pointer px-4 py-3 hover:bg-slate-50 border-b last:border-none">${patient.First_Name} ${patient.Last_Name} — ${patient.Phone || patient.Email || 'אין פרטי קשר'}</div>
            `).join('');
            suggestions.classList.toggle('hidden', rows.length === 0);
        }

        function selectPatient(patientId, displayName) {
            selectedPatient = { Patient_ID: patientId, displayName };
            document.getElementById('selectedPatient').innerText = displayName;
            document.getElementById('patientSuggestions').classList.add('hidden');
            document.getElementById('patientSearch').value = displayName;
        }

        async function loadPayments() {
            const response = await fetch('/api/payments?limit=10');
            const json = await response.json();
            const rows = json.data || [];
            const body = document.getElementById('paymentsTableBody');
            body.innerHTML = rows.length ? rows.map(payment => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4 text-sm text-slate-700">${payment.Payment_ID}</td>
                    <td class="px-6 py-4 text-sm text-slate-700">${payment.Payment_Date || ''}</td>
                    <td class="px-6 py-4 text-sm text-slate-700">${payment.patient_first_name || ''} ${payment.patient_last_name || ''}</td>
                    <td class="px-6 py-4 text-sm text-slate-700">${payment.Payment_Method || ''}</td>
                    <td class="px-6 py-4 text-sm text-slate-700">${parseFloat(payment.Amount).toFixed(2)} ₪</td>
                    <td class="px-6 py-4 text-sm text-emerald-600 font-medium">שולם</td>
                </tr>
            `).join('') : '<tr><td class="px-6 py-4 text-sm text-slate-500" colspan="6">לא נמצאו תשלומים</td></tr>';
        }

        async function createPayment(event) {
            event.preventDefault();
            if (!selectedPatient) {
                alert('יש לבחור מטופל לפני ביצוע התשלום.');
                return;
            }
            const amount = parseFloat(document.getElementById('amount').value);
            const paymentMethod = document.getElementById('paymentMethod').value;
            const paymentDate = document.getElementById('paymentDate').value;
            const serviceType = document.getElementById('serviceType').value;
            const cardLast4 = document.getElementById('cardLast4').value || null;
            const authCode = document.getElementById('authCode').value || null;
            const notes = document.getElementById('notes').value;

            const payload = {
                payment_id: Math.floor(Date.now() / 1000),
                amount,
                payment_date: paymentDate,
                payment_method: paymentMethod,
                cardlast4: cardLast4,
                authcode: authCode,
                receiptno: `INV-${Date.now()}`,
                patient_id: selectedPatient.Patient_ID
            };

            const response = await fetch('/api/payments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                const error = await response.json();
                alert(error.error || 'שגיאה ביצירת תשלום');
                return;
            }
            document.getElementById('paymentMessage').innerText = `התשלום בוצע בהצלחה ל-${selectedPatient.displayName} בסך ${amount.toFixed(2)} ₪`;
            await loadPayments();
        }

        function debounce(fn, delay) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn(...args), delay);
            };
        }

        window.onload = initBilling;
    </script>
</body>
</html>
